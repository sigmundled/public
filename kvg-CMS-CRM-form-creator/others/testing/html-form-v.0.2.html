<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Abonnement Newsletter</title>
 <style>
   * { box-sizing: border-box; margin: 0; padding: 0; }
   body { font-family: Arial, sans-serif; background: #f5f5f5; }
   .form-container {
     max-width: 560px; margin: 40px auto; background: #fff;
     padding: 32px; border-radius: 8px;
     box-shadow: 0 2px 12px rgba(0,0,0,0.08);
   }
   h2 { color: #1F4E79; margin-bottom: 24px; }
   .form-group { margin-bottom: 18px; }
   label { display: block; font-weight: bold; margin-bottom: 6px;
           color: #333; font-size: 14px; }
   input[type="text"], input[type="email"] {
     width: 100%; padding: 10px 12px; border: 1px solid #ccc;
     border-radius: 4px; font-size: 15px;
   }
   input[type="text"]:focus, input[type="email"]:focus {
     outline: none; border-color: #1F4E79;
   }
   .checkbox-group { margin-bottom: 12px; }
   .checkbox-group label {
     display: flex; align-items: flex-start;
     font-weight: normal; cursor: pointer;
   }
   .checkbox-group input[type="checkbox"] {
     margin-right: 10px; margin-top: 3px; width: 16px; height: 16px;
   }
   .consent-section {
     background: #f0f7ff; border-left: 3px solid #1F4E79;
     padding: 16px; border-radius: 0 4px 4px 0; margin-bottom: 20px;
   }
   .consent-title { font-weight: bold; color: #1F4E79;
                    margin-bottom: 10px; font-size: 14px; }
   button[type="submit"] {
     width: 100%; background: #1F4E79; color: white;
     padding: 12px; border: none; border-radius: 4px;
     font-size: 16px; font-weight: bold; cursor: pointer;
   }
   button[type="submit"]:hover { background: #163c63; }
   .required { color: #cc0000; }
   .form-note { font-size: 12px; color: #666; margin-top: 12px; }
 </style>
</head>
<script type="text/javascript" src="https://analytics.clickdimensions.com/ts.js" > </script>

<script type="text/javascript">
  var cdAnalytics = new clickdimensions.Analytics('analytics.clickdimensions.com');
  cdAnalytics.setAccountKey('amrb2vDs10263gxpnkXIw');
  cdAnalytics.setDomain('kverneland.com');
  cdAnalytics.setScore(typeof(cdScore) == "undefined" ? 0 : (cdScore == 0 ? null : cdScore));
  cdAnalytics.trackPage();
</script>
<body>
 
<!-- ClickDimensions Form Capture -->
<!-- ACTION URL : remplacez VOTRE_ACTION_URL par l'URL copiée depuis CRM -->
<form method="POST"
    action="https://analytics.clickdimensions.com/forms/h/a4yEg6IucR0Wyw0hXjs5Dt"
     class="form-container">
 
 <h2>Restez informé</h2>
 
 <!-- Prénom -->
 <div class="form-group">
   <label for="firstname">Prénom <span class="required">*</span></label>
   <input type="text" id="firstname" name="firstname"
          required placeholder="Votre prénom">
 </div>
 
 <!-- Nom -->
 <div class="form-group">
   <label for="lastname">Nom <span class="required">*</span></label>
   <input type="text" id="lastname" name="lastname"
          required placeholder="Votre nom">
 </div>
 
 <!-- Email -->
 <div class="form-group">
   <label for="emailaddress1">Email <span class="required">*</span></label>
   <input type="email" id="emailaddress1" name="emailaddress1"
          required placeholder="votre@email.com">
 </div>
 
 <!-- Société -->
 <div class="form-group">
   <label for="companyname">Société</label>
   <input type="text" id="companyname" name="companyname"
          placeholder="Nom de votre société">
 </div>
 
 <!-- Cases à cocher abonnements -->
 <div class="consent-section">
   <div class="consent-title">Vos abonnements</div>
 
   <div class="checkbox-group">
     <label>
       <input type="checkbox" name="newsletter" value="on">
       <span>Je souhaite recevoir la <strong>Newsletter</strong>
       (actualités, conseils, articles)</span>
     </label>
   </div>
 
   <div class="checkbox-group">
     <label>
       <input type="checkbox" name="productupdates" value="on">
       <span>Je souhaite recevoir les <strong>Mises à jour produit</strong>
       (nouvelles fonctionnalités, releases)</span>
     </label>
   </div>
 </div>
 
 <button type="submit">S'abonner</button>
 
 <p class="form-note">
   Vous pouvez vous désabonner à tout moment.
   Consultez notre <a href="/politique-confidentialite">politique de confidentialité</a>.
 </p>
 
</form>
 
</body>
</html>
