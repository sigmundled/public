<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Hub</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(17, 24, 39, 0.82);
            --text: #e6ecff;
            --muted: #b8c0de;
            --accent: #5b8cff;
            --accent-2: #25d9a8;
            --border: rgba(148, 163, 184, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top right, #13244a 0%, var(--bg) 52%);
            color: var(--text);
            min-height: 100vh;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 20px 56px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 3rem);
            letter-spacing: 0.02em;
        }

        .subtitle {
            margin: 14px 0 40px;
            max-width: 680px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .solutions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .solution-card {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.34);
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .solution-card:hover {
            border-color: rgba(91, 140, 255, 0.55);
            transform: translateY(-3px);
            box-shadow: 0 28px 56px rgba(0, 0, 0, 0.44);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 14px;
            line-height: 1;
        }

        .card-title {
            margin: 0 0 8px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }

        .card-description {
            margin: 0;
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.55;
            flex: 1;
        }

        .card-arrow {
            margin-top: 18px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Solution Hub</h1>
        <p class="subtitle">A collection of standalone tools and utilities. Select a solution below to get started.</p>

        <div class="solutions-grid">
            <a class="solution-card" href="image-filename-sanitizer/">
                <div class="card-icon">🖼️</div>
                <h2 class="card-title">Image Filename Sanitizer</h2>
                <p class="card-description">Generate clean, lowercase, sanitized filenames for product images using cascading brand, catalogue group, product group, and product selection.</p>
                <span class="card-arrow">Open solution →</span>
            </a>
        </div>
    </main>
</body>
</html>
